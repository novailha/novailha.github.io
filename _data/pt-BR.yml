faq:
  title: Perguntas
  items:
    - { q: "Tem demo?", a: "Tem uma demo gratuita planejada. A gente avisa assim que a página da Steam estiver no ar." }
    - { q: "É só para uma pessoa jogar?", a: "Sim. É um jogo solo, sem cronômetro nem penalidades." }
    - { q: "Linux é suportado?", a: "Sim! ROBOTS EVERYWHERE! vai rodar no Linux e no Windows." }
    - { q: "Funciona com controle?", a: "Sim, controle está nos planos." }
    - { q: "Vocês usam IA generativa?", a: "Usamos ferramentas de auxílio ao código. Todo o resto foi feito por humanos, sem IA generativa." }
    - { q: "Quem fez este jogo?", a: "A Nova Ilha Estúdio, um estúdio pequeno de Florianópolis." }
