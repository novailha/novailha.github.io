meta:
  title: "ROBOTS EVERYWHERE! - jogo solarpunk de objeto oculto para PC"
  description: "Um jogo tranquilinho de objetos ocultos com um clima solarpunk para PC. Viaje pelas eras enquanto os robôs cuidam de uma Terra bem calma."
  og: "Uma Terra tranquila, cuidada pelos robôs."
hero:
  badge: Jogo de objetos ocultos para PC
  tagline: Os humanos sumiram. Os robôs continuaram cuidando do mundo.
  wishlist: Página da Steam em breve
  more: O que é?
  chips: [PC, Um jogador, Relaxante, Aconchegante, Suporta controle, Steam Deck planejado]
about:
  title: Um mundo que seguiu em frente.
  text: "Com o passar das eras, as pessoas foram criando robôs cada vez melhores em tudo. Não tem guerra nem desastre. Os humanos só vão ficando desnecessários e sumindo aos poucos, enquanto os robôs continuam entregando cartas, dando aulas e limpando ruas que já estão limpinhas."
  alt: Uma cidade solarpunk tomada por plantas, cuidada por robôs
features:
  title: Como jogar
  items:
    - { title: "🔎 Muitas coisas, poucos segredos", text: "Cada cena está cheia de objetos. Só alguns são os que você precisa encontrar; o resto está lá só para curtir." }
    - { title: "🌿 Sem pressa nem pressão", text: "Vai no seu tempo. As dicas vêm em duas etapas: primeiro dão uma ideia e, se você pedir de novo, apontam mais perto." }
    - { title: "📖 Histórias escondidas", text: "Nas primeiras eras, rolam fotos de família e brinquedos. Depois aparecem relógios parados, livros antigos e plantas crescendo nas estantes." }
    - { title: "🌍 Um mundo, várias eras", text: "Da oficina apertada dos anos 2020 até uma megafloresta, dá para ver a mesma Terra evoluir." }
