faq:
  title: Questions
  items:
    - { q: "Is there a demo?", a: "A free demo is planned. Announcements will be shared when the Steam page launches." }
    - { q: "Is it single player?", a: "Yes, it is a single player game with no timers or penalties." }
    - { q: "Is Linux supported?", a: "Yes. ROBOTS EVERYWHERE! will support Linux alongside Windows." }
    - { q: "Does it support controllers?", a: "Yes, controller support is planned." }
    - { q: "Does the project use generative AI?", a: "Code assist tools were used. All other assets were created by humans, with no generative AI used." }
    - { q: "Who made this game?", a: "Nova Ilha Estúdio, a tiny studio from Florianópolis, Brazil." }
