meta:
  title: "ROBOTS EVERYWHERE! - solarpunk hidden object game for PC"
  description: "A calm solarpunk hidden object game for PC. Travel through the eras as robots inherit a quiet Earth."
  og: "A quiet Earth, tended by robots."
