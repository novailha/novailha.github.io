  badge: Hidden object game for PC
  tagline: The humans faded away. The robots kept the world running.
  wishlist: Steam page coming soon
  more: What is it?
  chips: [PC, Single player, Chill, Wholesome, Controller support, Steam Deck planned]
about:
  title: A world that simply kept going.
  text: "Across the eras, people build robots that get better at everything. There is no war and no disaster. Humans just become unnecessary and slowly disappear, while the robots keep delivering letters, teaching classes and cleaning streets that are already clean."
  alt: A solarpunk city overgrown with plants, tended by robots
features:
  title: How it plays
  items:
    - { title: "🔎 Hundreds of props, a few secrets", text: "Every scene is packed with props. Only some are hidden objects, the rest is there to be admired." }
    - { title: "🌿 No timers, no pressure", text: "Take your time. A two-step hint system nudges you first and points closer only if you ask." }
    - { title: "📖 Stories in objects", text: "Early eras hide family photos and toys. Later ones leave stopped clocks, old books and plants growing through the shelves." }
    - { title: "🌍 One world, many eras", text: "From a cramped 2020s workshop to the 2130s, watch the same Earth change." }
