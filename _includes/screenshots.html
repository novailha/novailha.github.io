<div class="screenshots">
  {% for screenshot in s.screenshots %}
  <figure>
    <a href="{{ screenshot.path }}">
      <img src="{{ screenshot.path }}" alt="{{ screenshot.alt }}" loading="{% if forloop.first %}eager{% else %}lazy{% endif %}">
    </a>
    {% if screenshot.caption != "" %}<figcaption>{{ screenshot.caption }}</figcaption>{% endif %}
  </figure>
  {% endfor %}
</div>
